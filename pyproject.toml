[project]
name = "pdf-knowledge-assistant"
version = "1.0.0"
description = "Source-cited Gemini RAG app with LangChain, ChromaDB, FastAPI and Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.18,<1.0",
  "streamlit>=1.39,<2.0",
  "google-genai>=1.0,<2.0",
  "pydantic-settings>=2.5,<3.0",
  "requests>=2.31,<3.0",
  "pymupdf>=1.25,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  "langchain-chroma>=1.0,<2.0",
  "chromadb>=1.0,<2.0",
]
[dependency-groups]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
[tool.ruff]
line-length = 100
