name: Python tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Offline unit tests
        run: uv run pytest -q
